<script>
/* ══════════════════ ARTICLES ══════════════════ */
const articles = [
  {id:0,kicker:"Skolestruktur",title:"Flere end 100 forældre mødte op på Auning Skole: “Vi vil ikke have, at vores skole bliver revet væk under os”",dek:"Det var et fyldt lokale, da forældre og politikere tirsdag aften skulle tale om fremtidens folkeskoler i Norddjurs. I dag går børnene fra Langhøjskolen, Allingåbroskolen og Rougsøskolen videre til Auning Skole i 7. klasse — men den ordning kan snart være fortid.",date:"5. oktober 2026",byline:"Af lokalredaktionen",image:"https://upload.wikimedia.org/wikipedia/commons/f/f9/Auning%2801%29.JPG",caption:"Auning Skole danner i dag rammen om udskolingen for elever fra flere mindre skoler i Norddjurs. (Foto: Hideko Bondesen / Wikimedia Commons, CC BY-SA 2.5)",source:"TV2 Østjylland",sourceUrl:"https://www.tv2ostjylland.dk/norddjurs/flere-hundrede-er-samlet-for-at-kaempe-for-landsbyskoler-fbd9b",text:`<p>Det var et fyldt lokale på Auning Skole tirsdag aften, da mere end 100 forældre mødte op for at tale om fremtidens folkeskoler i Norddjurs Kommune. Mødet var arrangeret i forlængelse af kommunens arbejde med at forme “Fremtidens Folkeskole”, som for alvor gik i gang i foråret, og hvor planerne nu er blevet til konkrete forslag.</p><p>I den nordvestlige del af kommunen er der lige nu tre skoler med lige over 100 elever på hver: Langhøjskolen i Vivild, Allingåbroskolen og Rougsøskolen i Ørsted. I dag flytter børnene fra disse skoler til Auning Skole, når de skal i syvende klasse. Men den ordning kan snart være fortid.</p><p>Ifølge TV2 Østjylland peger politikerne på to mulige modeller. Enten at samle alle eleverne på én skole og lukke de to andre. Eller at lade én af skolerne have elever helt fra 0. til 9. klasse og lade de to andre have elever op til 3. eller 6. klasse.</p><p>“Vi vil ikke have, at vores skole bliver revet væk under os,” lød det fra en af de fremmødte forældre på mødet.</p><p>Baggrunden er et skoleområde, der ventes at overskride budgettet med 10 millioner kroner næste år. Borgere kan stadig sende høringssvar frem til 15. oktober.</p><p>Debatten fortsætter i kommunalbestyrelsen, hvor der skal træffes endelig beslutning om skolestrukturen. For forældrene på Auning Skole handler det ikke kun om deres egen skole, men om hele lokalsamfundet i den nordvestlige del af Norddjurs.</p>`},

  {id:1,kicker:"Løb for Livet",title:"Løb for Livet: 24 timer med natbadminton, disko i svømmehallen og dyst på romaskiner",dek:"Det er ikke et almindeligt motionsløb. Når Auning Skoles udskoling går i gang med Løb for Livet, holder eleverne sig i bevægelse i et helt døgn — med natbadminton, skakturnering, spinningkonkurrence og klasselokaler pyntet som forskellige lande.",date:"Tradition",byline:"Af lokalredaktionen",image:"https://upload.wikimedia.org/wikipedia/commons/d/dc/Auning%2804a%29Kirken_set_fra_%C3%B8st.JPG",caption:"Løb for Livet er et 24-timers aktivitetsmaraton for hele udskolingen på Auning Skole. (Foto: Hideko Bondesen / Wikimedia Commons, CC BY-SA 2.5)",source:"TV2 Østjylland",sourceUrl:"https://www.tv2ostjylland.dk/skoleelever-loeber-i-24-timer",videoIframe:"https://www.tv2ostjylland.dk/skoleelever-loeber-i-24-timer",text:`<p>Det er ikke et almindeligt motionsløb, når Auning Skoles udskoling afholder “Løb for Livet”. Det er et 24-timers aktivitetsmaraton, der starter klokken 10.00 dagen før efterårsferien — og hvor hele udskolingen er i bevægelse, indtil det hele slutter næste formiddag.</p><p>“Klokken 10.00 i dag lød startskuddet til dette års Løb for livet, som det næste døgn afvikles i hele vores udskoling,” har skolen tidligere skrevet om arrangementet.</p><p>Løb for Livet er en pendant til det klassiske motionsløb, som mange skoler traditionen tro afvikler fredag op til efterårsferien. Men hvor de fleste skoler sender eleverne ud på en rute, laver Auning Skoles udskoling alle mulige andre former for motion det næste døgn.</p><p>Eleverne deltager på skift i de mange aktiviteter. Hver klasse skal holde en motionscykel kørende hele døgnet, og klasserne dyster samtidig om at ro længst på tid på skolens romaskiner.</p><p>Programmet er pakket med idrætsaktiviteter, natbadminton, natdisko i svømmehallen, skakturnering, spinningkonkurrence, romaskiner, dans, bow combat og tiovli-aktiviteter — og ifølge skolen selv “meget, meget mere”.</p><p>På skolen er klasselokalerne pyntet i tema ud fra det land, som den enkelte klasse har fået tildelt. Om aftenen går det løs med blandt andet ridning på rodeotyr, disko-svømning og UV-fodbold.</p><p>“Et helt døgn med fuld knald på og masser af bevægelse — og helt sikkert masser af trætte unge mennesker i morgen kl. 10, når det hele slutter og efterårsferien starter,” har skolen skrevet om arrangementet.</p><p>For eleverne er Løb for Livet blevet en fast tradition og et af de arrangementer, de ser mest frem til i løbet af skoleåret.</p>`},

  {id:2,kicker:"Budget",title:"1,7 millioner kroner frigivet: Auning Skole får nyt faglokale",dek:"Økonomiudvalget i Norddjurs Kommune har godkendt at frigive midlerne til et faglokale til håndværk og design. Pengene blev afsat i budgettet for 2026–2029.",date:"10. marts 2026",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-budget/600/400",caption:"Det nye faglokale skal bruges til håndværk og design.",source:"Norddjurs Kommune",sourceUrl:"https://norddjurs.meetingsplus.dk/welcome-da/udvalg/okonomiudvalget/10-03-2026/protocol/15-anlaegsbevilling-til-faglokaler-pa-auning-skolepdf",text:`<p>Økonomiudvalget i Norddjurs Kommune har godkendt at frigive 1,7 millioner kroner til et nyt faglokale på Auning Skole. Beslutningen blev truffet den 10. marts 2026 og følger op på budgetaftalen for 2026–2029, hvor beløbet blev afsat.</p><p>Midlerne skal bruges til etablering af et faglokale til håndværk og design på Auning Skole. Ifølge sagsfremstillingen skal lokalet etableres i tæt dialog med skolen.</p><p>Derudover var der i 2025 et mindreforbrug på 0,7 millioner kroner på anlægsprojektet “Faglokaler inde og ude”, som også vedrører Auning Skole.</p><p>For Auning Skole betyder det, at arbejdet med at forbedre de fysiske rammer for håndværk og design nu kan gå videre.</p>`},

  {id:3,kicker:"Dialogmøde",title:"150 borgere stillede op: Skoleområdet mangler 10 millioner",dek:"Omkring 150 borgere mødte op til dialogmøde i Auning for at få svar på planerne for fremtidens folkeskoler i Norddjurs Kommune.",date:"9. oktober 2026",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-meeting/600/400",caption:"Dialogmødet i Auning samlede omkring 150 borgere.",source:"TV2 Østjylland",sourceUrl:"https://www.tv2ostjylland.dk/norddjurs/tre-skoler-lige-nu-i-spil-som-lukningstruede-i-norddjurs-a869d",text:`<p>Omkring 150 borgere mødte op til dialogmøde i Auning for at få svar på planerne for fremtidens folkeskoler i Norddjurs Kommune. Mødet var en del af den høringsproces, hvor borgere kan sende input frem til 15. oktober.</p><p>Tre skoler i den nordvestlige del af kommunen er i spil til lukning: Langhøjskolen i Vivild, Allingåbroskolen og Rougsøskolen i Ørsted. Politikerne peger på et skoleområde, der ventes at overskride budgettet med 10 millioner kroner næste år.</p><p>Dialogen fortsætter i kommunalbestyrelsen, og der er lagt op til en bred politisk behandling af sagen.</p>`},

  {id:4,kicker:"Hverdag",title:"Hver fredag bliver klasselokalet til et svejseværksted",dek:"15-årige Silas Hilmer Gregersen går på den erhvervs- og praksisfaglige linje på Auning Skole. Hver fredag sendes han ud i erhvervspraktik og svejser små dele sammen.",date:"28. oktober 2024",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-welding/600/400",caption:"På den erhvervs- og praksisfaglige linje kommer eleverne ud i virksomheder hver fredag.",source:"TV2 Østjylland",sourceUrl:"https://www.tv2ostjylland.dk/norddjurs/det-har-aendret-silas-skolegang",text:`<p>15-årige Silas Hilmer Gregersen går i niende klasse på den erhvervs- og praksisfaglige linje på Auning Skole. Hver fredag sendes han ud i erhvervspraktik og svejser små dele sammen til en miniature gokart-model.</p><p>“Det er vigtigt for mig, fordi i klasselokalet kan jeg ikke sidde helt stille. Jeg vil hellere ud at bruge hænderne,” siger han.</p><p>Auning Skole har i flere år haft fokus på at gøre undervisningen mere praksisnær og relevant for eleverne. Norddjurs Kommune er ifølge en undersøgelse fra Dansk Industri blandt de bedste i Danmark til samarbejde mellem skoler og virksomheder.</p>`},

  {id:5,kicker:"Fællesskab",title:"Elever samlede 52.000 kroner ind til ukrainske børn",dek:"Det begyndte med hjemmebagte muffins og armbånd. Målet var 10.000 kroner — men indsamlingen på Auning Skole voksede langt ud over alle forventninger.",date:"18. april 2022",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-ukraine/600/400",caption:"Eleverne på Auning Skole samlede mere end 52.000 kroner ind.",source:"TV2 Østjylland",sourceUrl:"https://www.tv2ostjylland.dk/norddjurs/imponerende-indsats-skoleelever-loeber-bager-og-rydder-op-til-fordel-for-ukrainske-boern",text:`<p>Eleverne på Auning Skole, særligt fra 5. årgang, samlede mere end 52.000 kroner ind til fordel for børn i Ukraine. Det begyndte med hjemmebagte muffins og armbånd, men voksede hurtigt til en indsats, der involverede store dele af byen.</p><p>“Jeg er mega imponeret af og stolt over de her børn, der har givet den en ordentlig skalle,” siger Kasper Fur Eriksen, der er lærer hos mellemtrinet på Auning Skole.</p><p>Eleverne samlede 227 kilo skrald ind i byen, vaskede vinduer, tømte opvaskemaskiner og lavede havearbejde for at tjene penge.</p>`},

  {id:6,kicker:"Sport",title:"Skolefodboldhold blandt de 16 bedste i Danmark",dek:"Både pigernes og drengenes hold på Auning Skole nåede kredsfinalerne i DBU Skolepokalen. Det er 30 år efter pigernes historiske sejr i Parken.",date:"9. december 2025",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-football/600/400",caption:"Auning Skoles fodboldhold nåede blandt de 16 bedste skolehold i Danmark.",source:"Din Avis",sourceUrl:"https://dinavis.dk/sport/ECE18824841/skolefodboldhold-imponerer-flot-i-landsdaekkende-turnering-i-30aaret-for-historisk-sejr-i-skolefodboldturneringen/",text:`<p>Auning Skoles fodboldhold markerede sig flot i årets DBU Skolepokalen. Både pigernes og drengenes hold nåede kredsfinalerne og dermed blandt de 16 bedste skolehold i Danmark.</p><p>I kredsfinalerne måtte begge Auning-mandskaber imidlertid strække gevær. Pigerne tabte 4-1 til Morten Børup Skolen fra Skanderborg. Drengene tabte 3-0 til Østerhåbskolen Torsted.</p><p>Det er i år 30 år siden, at Auning Skoles piger gik hele vejen i turneringen til Parken i København.</p>`},

  {id:7,kicker:"Undervisning",title:"1. klasse gjorde læsning meningsfuld med halloween og pralbønner",dek:"I 1. klasse på Auning Skole læste eleverne korte, lydrette ord, der passede til halloween. Senere handlede det om pralbønnens vej fra kim til plante.",date:"27. juni 2025",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-reading/600/400",caption:"Læseundervisningen på Auning Skole tager udgangspunkt i emner, der giver mening for eleverne.",source:"Viden om Læsning",sourceUrl:"https://videnomlaesning.dk/viden-og-vaerktoejer/webdok/m-som-i-meningsfuld-laeseundervisning/",text:`<p>I 1. klasse på Auning Skole læste og skrev eleverne korte, lydrette ord, der passede til halloween. Da sommeren nærmede sig, handlede det om pralbønnens vej fra kim til plante.</p><p>Undervisningen var en del af projektet (Selv)sikker læsestart, hvor der er fokus på læse- og skriveundervisning, der er meningsfuld for eleverne.</p><p>Henriette Romme Lund, specialkonsulent i Nationalt Videncenter for Læsning, besøgte skolen og talte med lærerne Kirsten Bilde Fogh og Kirsten Gjødvad Klinge.</p>`},

  {id:9,kicker:"Om skolen",title:"Auning Skole: 688 elever og et karaktergennemsnit på 6,8",dek:"Skolen har 21,4 elever pr. klasse og et karaktergennemsnit på 6,8 ved 9.-klasseprøverne i 2025/2026. Det viser nye nøgletal fra skoleklar.nu.",date:"2025/2026",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-stats/600/400",caption:"Auning Skole har 688 elever i skoleåret 2025/2026.",source:"skoleklar.nu",sourceUrl:"https://skoleklar.nu/skole/auning-skole/",text:`<p>Auning Skole har 688 elever og 21,4 elever pr. klasse i skoleåret 2025/2026. Det er lidt over kommunegennemsnittet på 20,0 og landsgennemsnittet på 20,7, viser nøgletal fra skoleklar.nu.</p><p>Karaktergennemsnittet ved 9.-klasseprøverne var 6,8 i 2025/2026 — mod 7,0 i Norddjurs Kommune og 7,3 på landsplan. Undervisningseffekten er 0, hvilket betyder, at eleverne klarer sig som forventet ud fra deres socioøkonomiske baggrund.</p><p>85,6 % af eleverne har høj trivsel. Det samlede elevfravær var 7,9 %, og 84,2 % af eleverne var i gang med en ungdomsuddannelse i september året efter 9. eller 10. klasse.</p><p>Elevtallet er faldet fra 693 i 2018/2019 til 688 i 2025/2026.</p>`},

  {id:10,kicker:"Om skolen",title:"8 specialklasser, 2 modtagelsesklasser og 120 ansatte",dek:"Auning Skole rummer knap 700 elever fra 0. til 9. klasse — og har både specialklasser, modtagelsesklasser og gode mellemformer.",date:"2025/2026",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-special/600/400",caption:"Auning Skole har 8 specialklasser og 2 modtagelsesklasser.",source:"Auning Skole / Norddjurs Kommune",sourceUrl:"https://auning-skole.aula.dk/info/auning-skole/generel-information",text:`<p>Auning Skole har 8 specialklasser, 2 modtagelsesklasser og “gode mellemformer”. På skolen er der i alt 120 ansatte, herunder ledelse, lærere, pædagoger, tekniske servicemedarbejdere samt it- og administrativt personale.</p><p>Specialklasserne er placeret blandt de almene klasser på skolen, og personalet er uddannet inden for specialfeltet. Skolen har modtagerklasser i henholdsvis indskoling, mellemtrin og udskoling — typisk for elever med flygtningebaggrund.</p><p>Norddjurs Kommunes modtagerklasser er placeret i Grenaa og Auning. To af de tre modtagelsesklasser ligger på Auning Skole. Fra skoleåret 2026-27 udfases ordningen til fordel for hurtigere integration i almenskolen.</p>`},

  {id:11,kicker:"Hverdag",title:"SFO'en har 135 elever — og skolen arbejder med “Såren”",dek:"Auning Skole har en SFO med 135 elever. Skolen har også gjort gode erfaringer med specialgruppen “Såren” for udfordrede elever i 1.–6. årgang.",date:"2025/2026",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-sfo/600/400",caption:"SFO'en på Auning Skole har 135 elever.",source:"Auning Skole / Norddjurs Kommune",sourceUrl:"https://auning-skole.aula.dk/sites/auning-skole.aula.dk/files/arkiv/Download_filer/Uddannelsesplan - 1. og 2. niveau.pdf",text:`<p>Til Auning Skole er der tilknyttet en SFO med 135 elever. Skolen har 650 elever på hele skolen og i alt 120 ansatte ifølge skolens uddannelsesplan.</p><p>På Auning Skole har der i en årrække været gjort gode erfaringer med den lokale specialgruppe “Såren”, som har været et tilbud for udfordrede elever i 1.–6. årgang. Fra skoleåret 2019/20 hedder tilbuddet “55åren” og tilbydes elever i 7. klasse.</p><p>Skolen arbejder også med “VPS” — videnproducerende skole — hvor lærerne systematisk producerer viden om praksis for at styrke undervisningskvaliteten.</p>`},

  {id:12,kicker:"Undervisning",title:"To voksne i klassen: Auning Skole styrker indskolingen",dek:"Fra skoleår 22/23 har alle klasser fra 0. til og med 3. klasse haft to voksne i klassen i 10 lektioner om ugen. Skolen vægter teamsamarbejde højt.",date:"2022/2023",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-indskoling/600/400",caption:"Auning Skole har to voksne i indskolingsklasserne i 10 lektioner om ugen.",source:"Auning Skole",sourceUrl:"https://auning-skole.aula.dk/sites/auning-skole.aula.dk/files/arkiv/Download_filer/Uddannelsesplan - 1. og 2. niveau.pdf",text:`<p>På Auning Skole vægter man teamsamarbejdet meget højt. Skolen er inddelt i årgangsteam, som består af 4-5 lærere, der i fællesskab har ansvaret for planlægningen og tilrettelæggelsen af undervisningen på en bestemt årgang.</p><p>Fra skoleår 22/23 har alle klasser fra 0. til og med 3. klasse haft to voksne i klassen i 10 lektioner om ugen. Det skal skabe trygge og faste rammer, hvor eleverne lærer, trives og deltager i fællesskabet.</p><p>Skolen arbejder ud fra PLF (Professionelle læringsfællesskaber) og har stort fokus på at skabe gode overgange mellem skole og dagtilbud, mellem de forskellige afdelinger og til ungdomsuddannelse.</p>`},

  {id:13,kicker:"Brand",title:"Brand på skolens toilet: Alle elever evakueret",dek:"Tirsdag den 26. februar 2019 opstod der brand på et toilet på Auning Skole. Alle skolens elever blev evakueret ud på sportspladsen, mens brandvæsnet fik styr på situationen.",date:"26. februar 2019",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-fire/600/400",caption:"Alle elever blev evakueret, da der opstod brand på et toilet på Auning Skole.",source:"TV2 Østjylland",sourceUrl:"https://www.tv2ostjylland.dk/norddjurs/brand-paa-skole-samtlige-elever-er-evakueret",text:`<p>På Auning Skole blev alle elever tirsdag den 26. februar 2019 evakueret, fordi der opstod brand i et af skolens toiletter. Røgudviklingen udløste skolens brandalarm, og brandvæsnet blev tilkaldt.</p><p>Eleverne blev evakueret ud på skolens sportsplads, hvor de blev samlet, mens brandfolkene arbejdede. Der var tale om en mindre brand, og alle kom sikkert ud.</p><p>Skolen fik efterfølgende stor ros for håndteringen af situationen, og både elever og personale fulgte evakueringsplanen til punkt og prikke.</p><p>Branden understreger vigtigheden af skolens brandberedskab, som løbende bliver synet og opdateret.</p>`},

  {id:14,kicker:"Fællesskab",title:"75 ordblinde elever samlet: “Fedt, at man ikke er alene”",dek:"Auning Skole samlede alle skolens 75 ordblinde elever til et arrangement i forbindelse med den internationale ordblindeuge. Målet var at skabe fællesskab og bryde tabuer.",date:"3. oktober 2019",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-ordblind/600/400",caption:"75 ordblinde elever deltog i arrangementet på Auning Skole.",source:"TV2 Østjylland",sourceUrl:"https://www.tv2ostjylland.dk/norddjurs/skole-samler-ordblinde-fedt-man-ikke-er-alene",text:`<p>Auning Skole samlede torsdag den 3. oktober 2019 alle skolens 75 ordblinde elever til et arrangement i forbindelse med den internationale ordblindeuge. Formålet var at skabe fællesskab og bryde tabuer omkring ordblindhed.</p><p>“Det er fedt, at vi samles og kan se, hvor mange vi er, og at man ikke er alene om det,” sagde Andreas Pors, der går i 8.a på Auning Skole, til TV2 Østjylland.</p><p>Arrangementet blev afholdt for at vise eleverne, at de ikke er alene, og at der er hjælp at hente. Skolen har 3 læsevejledere og en pædagogisk it-vejleder tilknyttet ordblindeindsatsen.</p><p>Omkring 20 % af en årgang på Auning Skole er ordblinde, hvilket er omkring det dobbelte af landsgennemsnittet.</p>`},

  {id:15,kicker:"Hverdag",title:"9. klasse på arbejde hos AKS Transport",dek:"En gruppe piger fra 9. klasse på Auning Skole besøgte AKS Transport for at arbejde og tjene penge til deres afsluttende tid i folkeskolen.",date:"9. april 2026",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-transport/600/400",caption:"Pigerne fra 9. klasse hjalp med praktiske opgaver hos AKS Transport.",source:"AKS Transport",sourceUrl:"https://www.akstransport.dk/nyheder/9-klasse-paa-arbejde-hos-os/",text:`<p>En gruppe engagerede piger fra 9. klasse på Auning Skole besøgte AKS Transport for at arbejde og tjene penge til fælles oplevelser i forbindelse med deres afsluttende tid i folkeskolen.</p><p>“Det giver noget andet, når de selv er med til at tjene pengene. De gør en indsats sammen og får samtidig et fællesskab ud af det,” fortæller kontaktlærer Cecilie.</p><p>Pigerne hjalp med praktiske opgaver som rengøring og oprydning, og de fik samtidig et indblik i hverdagen i en transportvirksomhed.</p><p>“Man tænker ikke over, hvor meget der egentlig ligger bag, og hvor mange der arbejder med det,” sagde Lærke fra 9. klasse.</p>`},

  {id:16,kicker:"Undervisning",title:"Temadage på 8. årgang: Fritidsjob er vejen til uddannelse og trivsel",dek:"Ungeindsatsen og UU Norddjurs har afholdt temadage i alle 8. klasser på Auning Skole om fritidsjob og praktik. Målet er at hjælpe eleverne bedre på vej mod uddannelse og job.",date:"17. december 2025",byline:"Af lokalredaktionen",image:"https://picsum.photos/seed/auning-temadage/600/400",caption:"8. klasse på Auning Skole har arbejdet med fritidsjob og praktik.",source:"Din Avis",sourceUrl:"https://dinavis.dk/samfund/ECE18853874/fritidsjob-er-vejen-til-uddannelse-job-og-bedre-trivsel/",text:`<p>Ungeindsatsen og Ungdommens Uddannelsesvejledning i Norddjurs har haft temadage i alle 8. klasser på Auning Skole som en del af det politisk bestemte “Uddannelse- og JobBoost”.</p><p>Temaet har været “Fritidsjob og Praktik”, og eleverne har blandt andet været på virksomhedsbesøg og interviewet mere end 20 virksomheder.</p><p>“Vi ved, at det at have et fritidsjob kan løfte den unge og give en række redskaber med i værktøjskassen, som ikke nødvendigvis læres i skolen,” siger UU-vejleder Kristian Sørig.</p><p>Undersøgelser viser, at unge med et fritidsjob har op mod tre gange så stor sandsynlighed for at være i arbejde som 25-29-årig.</p>`},

/* ══════════════════ LAZY IMAGE FADE ══════════════════ */
document.querySelectorAll('img[loading="lazy"]').forEach(img => {
  img.classList.add('lazy');
  if (img.complete && img.naturalHeight !== 0) {
    img.classList.add('loaded');
  } else {
    img.addEventListener('load', () => img.classList.add('loaded'));
    img.addEventListener('error', () => img.classList.add('loaded'));
  }
});

/* ══════════════════ HOME RENDER ══════════════════ */
const latestList = document.getElementById('latestList');
const structureGrid = document.getElementById('structureGrid');
const practiceGrid = document.getElementById('practiceGrid');
const mostReadList = document.getElementById('mostReadList');

function renderLatest(id){
  const a = articles.find(x => x.id === id); if(!a) return;
  const el = document.createElement('div');
  el.className = 'live-item';
  el.dataset.article = id;
  el.innerHTML = '<span class="live-time">' + a.date.split(' ')[0] + '.</span><p>' + a.title + '</p>';
  latestList.appendChild(el);
}
function cardHTML(id){
  const a = articles.find(x => x.id === id); if(!a) return '';
  return '<div class="card" data-article="' + id + '"><div class="media r-3x2"><img src="' + a.image + '" alt="" loading="lazy"></div><h3>' + a.title + '</h3><p>' + a.kicker + '</p><div class="meta"><span>' + a.date + '</span></div></div>';
}
function renderMostRead(id, index){
  const a = articles.find(x => x.id === id); if(!a) return;
  const el = document.createElement('div');
  el.className = 'mr-item';
  el.dataset.article = id;
  el.innerHTML = '<span class="mr-num">' + (index + 1) + '</span><p>' + a.title + '</p>';
  mostReadList.appendChild(el);
}
function renderHome(filter){
  latestList.innerHTML = ''; structureGrid.innerHTML = ''; practiceGrid.innerHTML = ''; mostReadList.innerHTML = '';
  let ids = articles.map(a => a.id);
  if(filter && filter !== 'all') ids = articles.filter(a => a.kicker === filter).map(a => a.id);
  if(ids.length === 0) ids = articles.map(a => a.id);

  const latestIds = ids.slice(0, 6);
  latestIds.forEach(renderLatest);

  structureGrid.innerHTML = ids.slice(0, 4).map(cardHTML).join('');
  practiceGrid.innerHTML = ids.slice(0, 4).map(cardHTML).join('');
  ids.slice(0, 5).forEach((id, i) => renderMostRead(id, i));

  document.querySelectorAll('img[loading="lazy"]').forEach(img => {
    if (!img.classList.contains('lazy')) {
      img.classList.add('lazy');
      if (img.complete && img.naturalHeight !== 0) img.classList.add('loaded');
      else img.addEventListener('load', () => img.classList.add('loaded'));
    }
  });
}
renderHome('all');

/* ══════════════════ ARTICLE VIEW ══════════════════ */
const homeView = document.getElementById('homeView');
const articleView = document.getElementById('articleView');
const progress = document.getElementById('readProgress');
const backTop = document.getElementById('backTop');

function articlePageHTML(a){
  const related = articles.filter(x => x.id !== a.id).slice(0, 3);
  const relatedHTML = related.map(x =>
    '<div class="card" data-article="' + x.id + '"><div class="media r-3x2"><img src="' + x.image + '" alt="" loading="lazy"></div><h3>' + x.title + '</h3><p>' + x.kicker + '</p><div class="meta"><span>' + x.date + '</span></div></div>'
  ).join('');

  let videoHTML = '';
  if (a.videoIframe) {
    // Embed the TV2 Østjylland article page – the video player is at the top.
    videoHTML =
      '<div class="video-block" style="aspect-ratio:16/9;">' +
        '<iframe src="' + a.videoIframe + '" title="Video: ' + a.title + '" ' +
          'allow="autoplay; encrypted-media; fullscreen; picture-in-picture" ' +
          'allowfullscreen loading="lazy" ' +
          'style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;">' +
        '</iframe>' +
      '</div>';
  }

  const figureHTML = a.videoIframe ? '' :
    '<figure class="article-figure"><img src="' + a.image + '" alt="' + a.title + '">' +
      (a.caption ? '<figcaption>' + a.caption + '</figcaption>' : '') +
    '</figure>';

  return '<div class="article-page">' +
    '<a href="#/" class="back-link" id="backToHome">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>' +
      'Tilbage til forsiden' +
    '</a>' +
    '<header class="article-head">' +
      '<span class="kicker">' + a.kicker + '</span>' +
      '<h1>' + a.title + '</h1>' +
      '<p class="article-dek">' + a.dek + '</p>' +
      '<div class="article-meta">' +
        '<span class="author">' + a.byline + '</span>' +
        '<span class="sep">·</span>' +
        '<span>' + a.date + '</span>' +
      '</div>' +
    '</header>' +
    videoHTML +
    figureHTML +
    '<div class="article-body">' + a.text + '</div>' +
    '<div class="article-source">' +
      '<strong>Kilde:</strong> <a href="' + a.sourceUrl + '" target="_blank" rel="noopener">' + a.source + '</a>' +
    '</div>' +
    '<section class="article-related">' +
      '<h2>Læs også</h2>' +
      '<div class="grid">' + relatedHTML + '</div>' +
    '</section>' +
  '</div>';
}

/* Smooth transition using View Transitions API when available */
function showArticle(a){
  const apply = () => {
    articleView.innerHTML = articlePageHTML(a);
    homeView.hidden = true;
    articleView.hidden = false;
    document.body.classList.add('reading');
    document.title = a.title + ' — Auning Skole Nyheder';
    window.scrollTo(0, 0);
    progress.style.width = '0%';
    const back = document.getElementById('backToHome');
    if(back) back.addEventListener('click', (e) => { e.preventDefault(); smoothBackToHome(); });
    articleView.querySelectorAll('img[loading="lazy"]').forEach(img => {
      img.classList.add('lazy');
      if (img.complete) img.classList.add('loaded');
      else img.addEventListener('load', () => img.classList.add('loaded'));
    });
  };
  if (document.startViewTransition) {
    document.startViewTransition(apply);
  } else {
    apply();
  }
}

function showHome(){
  homeView.hidden = false;
  articleView.hidden = true;
  articleView.innerHTML = '';
  document.body.classList.remove('reading');
  document.title = 'Auning Skole — Nyheder';
  progress.style.width = '0%';
  backTop.classList.remove('show');
}

function smoothBackToHome(){
  if (document.startViewTransition) {
    document.startViewTransition(showHome);
  } else {
    showHome();
  }
  history.pushState(null, '', '#/');
}

function router(){
  const match = location.hash.match(/^#\/artikel\/(\d+)/);
  if(match){ const a = articles.find(x => x.id === Number(match[1])); if(a){ showArticle(a); return; } }
  showHome();
}
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);

document.addEventListener('click', (e) => {
  const trigger = e.target.closest('[data-article]');
  if(trigger){
    e.preventDefault();
    location.hash = '#/artikel/' + trigger.dataset.article;
  }
});

/* Reading progress + back-to-top */
function updateProgress(){
  const doc = document.documentElement;
  const total = doc.scrollHeight - doc.clientHeight;
  const pct = total > 0 ? (doc.scrollTop / total) * 100 : 0;
  if (!articleView.hidden) progress.style.width = Math.min(100, Math.max(0, pct)) + '%';
  if (doc.scrollTop > 400) backTop.classList.add('show');
  else backTop.classList.remove('show');
}
window.addEventListener('scroll', updateProgress, { passive: true });
window.addEventListener('resize', updateProgress);

backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* ══════════════════ SEARCH ══════════════════ */
const searchOverlay = document.getElementById('searchOverlay');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchMeta = document.getElementById('searchMeta');
const searchBtn = document.getElementById('searchBtn');
const searchClose = document.getElementById('searchClose');
let searchSelectedIndex = -1;
let searchCurrentResults = [];
let searchDebounceTimer;

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightText(t, term){ if(!term) return t; return t.replace(new RegExp('(' + escapeRegex(term) + ')', 'gi'), '<mark>$1</mark>'); }
function openSearch(){
  searchOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  searchInput.value = '';
  searchSelectedIndex = -1;
  renderSearch('');
  setTimeout(() => searchInput.focus(), 60);
}
function closeSearch(){
  searchOverlay.classList.remove('open');
  document.body.style.overflow = '';
  searchSelectedIndex = -1;
}
function renderSearch(query){
  const term = query.trim();
  if(!term){ searchCurrentResults = articles.slice(0, 8); searchMeta.textContent = 'Seneste historier'; }
  else {
    const lower = term.toLowerCase();
    searchCurrentResults = articles.filter(a => {
      const body = a.text ? a.text.replace(/<[^>]+>/g, ' ') : '';
      return (a.title + ' ' + a.kicker + ' ' + (a.dek || '') + ' ' + body).toLowerCase().includes(lower);
    });
    searchMeta.textContent = searchCurrentResults.length + (searchCurrentResults.length === 1 ? ' resultat' : ' resultater');
  }
  if(searchCurrentResults.length === 0){ searchResults.innerHTML = '<div class="search-empty">Ingen historier matcher “' + term + '”.</div>'; return; }
  searchResults.innerHTML = searchCurrentResults.map((a, i) =>
    '<div class="search-result' + (i === searchSelectedIndex ? ' selected' : '') + '" data-result-index="' + i + '"><div class="thumb"><img src="' + a.image + '" alt=""></div><div class="info"><span class="cat">' + a.kicker + '</span><h4>' + highlightText(a.title, term) + '</h4><div class="date">' + a.date + '</div></div></div>'
  ).join('');
}
function updateSearchSelection(){
  const items = searchResults.querySelectorAll('.search-result');
  items.forEach((el, i) => el.classList.toggle('selected', i === searchSelectedIndex));
  if(searchSelectedIndex >= 0 && items[searchSelectedIndex]) items[searchSelectedIndex].scrollIntoView({ block: 'nearest' });
}
function openResultById(id){ closeSearch(); location.hash = '#/artikel/' + id; }

searchBtn.addEventListener('click', openSearch);
searchClose.addEventListener('click', closeSearch);
searchOverlay.addEventListener('click', (e) => { if(e.target === searchOverlay) closeSearch(); });
searchInput.addEventListener('input', (e) => {
  searchSelectedIndex = -1;
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => renderSearch(e.target.value), 90);
});
searchInput.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowDown'){ e.preventDefault(); if(!searchCurrentResults.length) return; searchSelectedIndex = (searchSelectedIndex + 1) % searchCurrentResults.length; updateSearchSelection(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); if(!searchCurrentResults.length) return; searchSelectedIndex = searchSelectedIndex <= 0 ? searchCurrentResults.length - 1 : searchSelectedIndex - 1; updateSearchSelection(); }
  else if(e.key === 'Enter'){ e.preventDefault(); const pick = searchSelectedIndex >= 0 ? searchSelectedIndex : 0; if(searchCurrentResults[pick]) openResultById(searchCurrentResults[pick].id); }
});
searchResults.addEventListener('click', (e) => {
  const item = e.target.closest('[data-result-index]');
  if(item){ const a = searchCurrentResults[Number(item.dataset.resultIndex)]; if(a) openResultById(a.id); }
});
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const inField = tag === 'INPUT' || tag === 'TEXTAREA';
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); }
  else if(e.key === '/' && !inField && !searchOverlay.classList.contains('open')){ e.preventDefault(); openSearch(); }
  else if(e.key === 'Escape' && searchOverlay.classList.contains('open')) closeSearch();
});

function openInfo(key){

  infoTitle.textContent = c.title;

  infoClose.focus();

function closeInfo(){
  infoModal.classList.remove('open');
  document.body.style.overflow = '';
  if(infoLastFocus) infoLastFocus.focus();
}
infoClose.addEventListener('click', closeInfo);
infoModal.addEventListener('click', (e) => { if(e.target === infoModal) closeInfo(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape' && infoModal.classList.contains('open')) closeInfo(); });

/* ══════════════════ ACTIONS ══════════════════ */
document.querySelectorAll('[data-action]').forEach(el => {
  el.addEventListener('click', (e) => {
    e.preventDefault();
    const action = el.dataset.action;
    if(action === 'live'){
      document.getElementById('breakingBar').scrollIntoView({ behavior: 'smooth', block: 'start' });
      window.scrollBy({ top: -80, behavior: 'smooth' });
    }
    else if(action === 'tv') openInfo('tv');
    else if(action === 'radio') openInfo('radio');
    else if(action === 'contact') openInfo('contact');
    else if(action === 'privacy') openInfo('privacy');
    else if(action === 'cookies') openInfo('cookies');
    else if(action === 'terms') openInfo('terms');
    else if(action === 'accessibility') openInfo('accessibility');
    document.body.classList.remove('nav-open');
  });
});

/* ══════════════════ FILTER ══════════════════ */
document.querySelectorAll('[data-filter]').forEach(el => {
  el.addEventListener('click', (e) => {
    e.preventDefault();
    const filter = el.dataset.filter;
    renderHome(filter);
    document.querySelectorAll('.nav a').forEach(a => a.classList.remove('active'));
    const navEl = document.querySelector('.nav a[data-filter="' + filter + '"]');
    if(navEl) navEl.classList.add('active');
    document.body.classList.remove('nav-open');
    if(!articleView.hidden) showHome();
    if(location.hash !== '#/' && location.hash !== '') location.hash = '#/';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
